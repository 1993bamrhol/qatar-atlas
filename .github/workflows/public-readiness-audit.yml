name: Public Readiness Audit

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  history-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for sensitive paths and credential patterns
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          path_pattern='(^|/)(\.env($|\.)|[^/]*\.(pem|key|p12|pfx|keystore)$|id_rsa($|\.)|credentials?($|\.)|secrets?($|\.))'
          secret_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|(postgres(ql)?|mysql|mongodb(\+srv)?|redis)://[^[:space:]'"'"'"]+:[^[:space:]'"'"'"]+@'
          assignment_pattern='(OPENAI_API_KEY|VERCEL_TOKEN|AWS_SECRET_ACCESS_KEY|DATABASE_URL|SUPABASE_SERVICE_ROLE_KEY|GITHUB_TOKEN|NEXTAUTH_SECRET)[[:space:]]*[:=][[:space:]]*[^[:space:]]{12,}'

          while IFS= read -r commit; do
            sensitive_paths="$(git ls-tree -r --name-only "$commit" | grep -E "$path_pattern" || true)"
            if [ -n "$sensitive_paths" ]; then
              echo "::error::Sensitive path(s) found in commit $commit"
              printf '%s\n' "$sensitive_paths"
              failed=1
            fi

            matched_files="$(git grep -I -l -E -e "$secret_pattern" -e "$assignment_pattern" "$commit" -- . 2>/dev/null || true)"
            if [ -n "$matched_files" ]; then
              echo "::error::Potential credential pattern found in commit $commit"
              printf '%s\n' "$matched_files" | sed "s#^$commit:##"
              failed=1
            fi
          done < <(git rev-list --all)

          if [ "$failed" -ne 0 ]; then
            echo "Public readiness history scan failed. Review commit/path findings before changing repository visibility."
            exit 1
          fi

          echo "Public readiness history scan passed: no sensitive path names or configured credential patterns found across reachable Git history."
