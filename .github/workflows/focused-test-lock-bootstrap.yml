name: Focused Test Lockfile Bootstrap

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove bootstrap
        run: |
          rm .github/workflows/focused-test-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/focused-test-lock-bootstrap.yml
          git commit -m "build: lock focused test dependency"
          git push
