name: Technical QA

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Route integrity
        run: npm run check:routes
      - name: Project content audit
        run: npm run check:content
      - name: Evidence integrity audit
        run: npm run check:evidence
      - name: Arabic completeness audit
        run: npm run check:ar
      - name: Accessibility and responsive audit
        run: npm run check:a11y
      - name: Visual responsive audit
        run: npm run check:visual
      - name: SEO and SSR audit
        run: npm run check:seo
      - name: Production build
        run: npm run build
