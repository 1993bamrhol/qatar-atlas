name: Release Visual QA

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Start app
        run: |
          npm run start -- -p 3000 > /tmp/qatar-atlas-next.log 2>&1 &
          echo $! > /tmp/qatar-atlas-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/en >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qatar-atlas-next.log
          exit 1
      - name: Browser and device QA
        run: node scripts/rc-browser-qa.mjs
      - name: Upload RC screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qatar-atlas-rc-visual-${{ github.sha }}
          path: artifacts/rc-visual
          if-no-files-found: error
          retention-days: 14
