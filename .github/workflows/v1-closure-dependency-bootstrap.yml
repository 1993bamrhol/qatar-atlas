name: V1 Closure Dependency Bootstrap

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  dependency-closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install regenerated graph
        run: npm ci
      - name: Audit dependency graph
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          audit_exit=$?
          set -e
          node - <<'NODE'
          const fs=require("fs");
          const a=JSON.parse(fs.readFileSync("audit.json","utf8"));
          console.log("AUDIT_METADATA="+JSON.stringify(a.metadata?.vulnerabilities??{}));
          for(const [name,v] of Object.entries(a.vulnerabilities??{})){
            console.log("AUDIT_VULN="+JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,fixAvailable:v.fixAvailable}));
          }
          if((a.metadata?.vulnerabilities?.high??0)!==0||(a.metadata?.vulnerabilities?.critical??0)!==0){
            console.error("HIGH_OR_CRITICAL_REMAIN");
            process.exit(1);
          }
          NODE
          echo "AUDIT_EXIT=$audit_exit"
      - name: Focused tests
        run: npm run test:focused
      - name: Commit lockfile and remove bootstrap
        run: |
          rm .github/workflows/v1-closure-dependency-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/v1-closure-dependency-bootstrap.yml
          git commit -m "build: lock patched V1 dependency graph"
          git push
